name: Telegram

# The project's Telegram channel hears about a release when it is published by hand or promoted from a prerelease
# to the latest release (tools/telegram-announce.sh). A release the Release workflow makes fires no release event
# (it is made with the workflow's own token), so release.yml announces its own release in its last step; this
# workflow covers the promotion (gh release edit TAG --prerelease=false --latest, the "released" event) and a
# message on request: Actions > Telegram > Run workflow, with the tag. Secrets: TELEGRAM_BOT_TOKEN (the bot is an
# admin of the channel), TELEGRAM_CHAT_ID.
on:
  release:
    types: [published, released]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v2026.11.01.1'
        required: true

permissions:
  contents: read

concurrency:
  group: telegram-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  announce:
    # only the project's releases (vYYYY.MM.DD.N): a test build published under another tag is not announced
    if: startsWith(github.event.release.tag_name || github.event.inputs.tag, 'v')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      ACTION: ${{ github.event.action || 'published' }}
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Announce
        run: sh tools/telegram-announce.sh release "$TAG" "$ACTION"
